<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gotp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2300acd7'/%3E%3Cpath d='M4 11.5V4.5h2.6a3.5 3.5 0 010 7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/oat.min.css">
<style>
  /* Layout only. Every colour, space and size below is an oat token. The one
     exception is --preview-canvas: the field behind the rendered template has
     to step away from it in both schemes, and oat has no token for that. */
  :root {
    --preview-canvas: light-dark(#fff, #0b0b0d);
    --primary: light-dark(#007d9c, #00acd7);
  }
  /* .stage and .badge set display, which beats the UA rule for [hidden]:
     without this the hidden tab panel and zeroed badges stay on screen. */
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  nav[data-topnav] { flex-shrink: 0; gap: var(--space-3); }
  nav[data-topnav] code { font-size: var(--text-8); color: var(--muted-foreground); }
  .panes { display: flex; flex-grow: 1; min-height: 0; }
  main { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; padding: 0; }
  main > header select { width: auto; max-width: 300px; flex-shrink: 1; min-width: 0;
                         margin-top: 0; padding: 5px 30px 5px 10px; }
  output#width { white-space: nowrap; min-width: 56px; text-align: right; }
  [role=group] button svg { width: 15px; height: 15px; }
  main > header, aside > header, aside > .meta {
    display: flex; align-items: center; gap: var(--space-2); min-height: 44px;
    padding: var(--space-2) var(--space-3);
    border-block-end: 1px solid var(--border); flex-shrink: 0;
  }
  aside > header { min-height: 50px; }
  .stage {
    flex-grow: 1; min-height: 0; overflow: auto; background: var(--preview-canvas);
    display: flex; justify-content: center; padding: var(--space-6);
  }
  .stage > * { align-self: flex-start; flex-shrink: 0; }
  #out { width: 620px; height: 100%; min-height: 600px; border: 0; background: #fff;
         box-shadow: var(--shadow-large); }
  #source { width: 100%; max-width: 900px; margin: 0; background: var(--card);
            border: 1px solid var(--border); border-radius: var(--radius-medium); overflow: hidden; }
  #source figcaption { display: flex; justify-content: space-between; gap: var(--space-4);
    padding: var(--space-2) var(--space-3); border-block-end: 1px solid var(--border);
    font-family: var(--font-mono); font-size: var(--text-8); color: var(--muted-foreground); }
  #source pre { margin: 0; padding: var(--space-3); font-size: var(--text-8); line-height: 1.75; }

  aside { width: 404px; flex-shrink: 0; background: var(--card);
          border-inline-start: 1px solid var(--border);
          display: flex; flex-direction: column; min-height: 0; }
  aside > footer { display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-3); border-block-start: 1px solid var(--border); flex-shrink: 0; }
  .rows { flex-grow: 1; min-height: 0; overflow: auto; }
  .rows th { width: 158px; font-family: var(--font-mono); font-size: var(--text-8);
             padding-inline: var(--space-3); white-space: nowrap; font-weight: var(--font-normal); }
  .rows td { padding: var(--space-1) var(--space-3) var(--space-1) 0; }
  .rows input { font-family: var(--font-mono); font-size: var(--text-8);
                padding: var(--space-1) var(--space-2); width: 100%; }
  .rows tr:not(:last-child) :is(th, td) { border-block-end: 1px solid var(--faint); }
  #json { flex-grow: 1; min-height: 0; margin: 0; border: 0; border-radius: 0;
          resize: none; font-family: var(--font-mono); font-size: var(--text-8);
          padding: var(--space-3); }

  [role=tablist], [role=group] { display: flex; gap: 2px; padding: 2px;
    background: var(--secondary); border-radius: var(--radius-medium); }
  [role=tablist] [role=tab] { font-size: var(--text-8); padding: var(--space-1) var(--space-3); }
  [role=group] button { padding: var(--space-1) var(--space-2); display: flex; }
  [role=tablist] button, [role=group] button {
    border: 0; background: none; color: var(--muted-foreground);
    border-radius: var(--radius-small); box-shadow: none; }
  [role=tablist] button[aria-selected=true], [role=group] button[aria-pressed=true] {
    background: var(--background); color: var(--foreground); }
  .spacer { flex-grow: 1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
                     clip-path: inset(50%); white-space: nowrap; }
  #empty { padding: var(--space-4) var(--space-3); border-block-end: 1px solid var(--border); }
  #empty p { margin: var(--space-2) 0 0; font-size: var(--text-7); color: var(--muted-foreground); }
  #status[hidden] { display: none; }
</style>
<script>
  // Oat's palette is built on light-dark(), so a theme is one property.
  try {
    var t = localStorage.getItem('gotp-theme');
    if (t) document.documentElement.style.colorScheme = t;
  } catch (e) {}
</script>
</head>
<body>

<nav data-topnav>
  <strong style="color:var(--primary)">gotp</strong>
  <code id="cmd"></code>
  <span class="spacer"></span>
  <span class="badge" data-variant="success" id="watching">live</span>
  <button class="ghost" id="theme" aria-label="Switch between light and dark">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
  </button>
</nav>

<div class="panes">
  <main>
    <header>
      <label class="visually-hidden" for="entry">Template</label>
      <select id="entry"></select>
      <span class="spacer"></span>
      <div role="tablist" aria-label="Left pane view">
        <button role="tab" id="tab-preview" aria-selected="true" aria-controls="panel-preview">Preview</button>
        <button role="tab" id="tab-source" aria-selected="false" aria-controls="panel-source">Source</button>
      </div>
      <div role="group" aria-label="Preview width">
        <button id="w-desktop" aria-pressed="true" aria-label="Full pane width">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button id="w-mobile" aria-pressed="false" aria-label="Mobile width, 390 pixels">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg>
        </button>
      </div>
      <output id="width"><code>620 px</code></output>
    </header>

    <div class="stage" role="tabpanel" id="panel-preview" aria-labelledby="tab-preview">
      <iframe id="out" src="/out" title="Rendered template"></iframe>
    </div>

    <div class="stage" role="tabpanel" id="panel-source" aria-labelledby="tab-source" hidden>
      <figure id="source">
        <figcaption><span id="source-name"></span><span>read-only</span></figcaption>
        <pre><code id="source-body"></code></pre>
      </figure>
    </div>
  </main>

  <aside aria-label="Template data">
    <header>
      <h2 style="font-size:var(--text-7);margin:0">Data</h2>
      <span class="spacer"></span>
      <div role="tablist" aria-label="Data editor mode">
        <button role="tab" id="tab-list" aria-selected="true" aria-controls="panel-list">List</button>
        <button role="tab" id="tab-json" aria-selected="false" aria-controls="json">JSON</button>
      </div>
    </header>

    <div class="meta">
      <span class="badge" data-variant="secondary" id="count-fields">0 fields</span>
      <span class="badge" data-variant="warning" id="count-unset" hidden>0 unset</span>
    </div>

    <section id="empty" hidden>
      <h3 style="font-size:var(--text-7);margin:0">No data provided</h3>
      <p>This template reads <strong id="empty-count">0 fields</strong>. Start from a skeleton built out of them, then fill in the values.</p>
      <button class="w-100 mt-4" id="autofill">Autofill from template fields</button>
      <small data-hint style="display:block;margin-top:var(--space-3)">same as <code>gotp fields --json</code></small>
    </section>

    <div class="rows" role="tabpanel" id="panel-list" aria-labelledby="tab-list">
      <table>
        <caption class="visually-hidden">Template data, one row per field path</caption>
        <tbody id="row-body"></tbody>
      </table>
    </div>

    <textarea id="json" role="tabpanel" aria-labelledby="tab-json" aria-label="Template data as JSON" spellcheck="false" hidden></textarea>

    <footer>
      <small data-hint id="status" role="status"></small>
      <span class="spacer"></span>
      <button id="apply">Apply</button>
    </footer>
  </aside>
</div>

<script src="/app.js"></script>
</body>
</html>
